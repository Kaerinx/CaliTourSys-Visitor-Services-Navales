openapi: 3.1.0
info:
  title: CaliTourSys CMS API
  version: 1.0.0
  description: Protected CMS API contract for Phase 07D foundation endpoints.
servers:
  - url: http://localhost:5000/api/v1
security:
  - BearerAuth: []
tags:
  - name: CMS Foundation
  - name: CMS Audit Logs
  - name: CMS Promotions
  - name: CMS Events
  - name: CMS Categories
  - name: CMS Products
  - name: CMS Destinations
  - name: CMS Businesses
  - name: CMS Museum
  - name: CMS Map Locations
  - name: CMS Operations
paths:
  /cms/health:
    get:
      tags:
        - CMS Foundation
      summary: Protected CMS health check
      security:
        - BearerAuth: []
      responses:
        "200":
          description: CMS health response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CmsHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cms/dashboard:
    get:
      tags:
        - CMS Foundation
      summary: CMS dashboard summary
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard summary counts and recent audit logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CmsDashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cms/navigation:
    get:
      tags:
        - CMS Foundation
      summary: Permission-filtered CMS navigation
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Navigation items allowed for the authenticated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - items
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/CmsNavigationItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cms/audit-logs:
    get:
      tags:
        - CMS Audit Logs
      summary: Safe paginated audit log list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AuditActionType"
        - name: entityType
          in: query
          schema:
            $ref: "#/components/schemas/CmsEntityType"
      responses:
        "200":
          description: Paginated safe audit log list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CmsAuditLogItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cms/promotions:
    get:
      tags:
        - CMS Promotions
      summary: Paginated CMS promotions
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/StatusParam"
        - $ref: "#/components/parameters/FeaturedParam"
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, -createdAt, updatedAt, -updatedAt, title, -title, status]
      responses:
        "200":
          description: Paginated promotions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CmsPromotion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - CMS Promotions
      summary: Create promotion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsPromotionInput"
      responses:
        "201":
          description: Created promotion
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CmsPromotion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /cms/promotions/{id}:
    get:
      tags:
        - CMS Promotions
      summary: Get promotion by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          description: Promotion detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CmsPromotion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - CMS Promotions
      summary: Update promotion
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsPromotionPatch"
      responses:
        "200":
          description: Updated promotion
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CmsPromotion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /cms/promotions/{id}/publish:
    patch:
      tags:
        - CMS Promotions
      summary: Publish promotion
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          $ref: "#/components/responses/PromotionSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cms/promotions/{id}/archive:
    patch:
      tags:
        - CMS Promotions
      summary: Archive promotion
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          $ref: "#/components/responses/PromotionSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cms/events:
    get:
      tags:
        - CMS Events
      summary: Paginated CMS events
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/StatusParam"
        - $ref: "#/components/parameters/FeaturedParam"
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, -createdAt, updatedAt, -updatedAt, title, -title, status, startsAt, -startsAt]
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CmsEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - CMS Events
      summary: Create event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CmsEvent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /cms/events/{id}:
    get:
      tags:
        - CMS Events
      summary: Get event by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          $ref: "#/components/responses/EventSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - CMS Events
      summary: Update event
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsEventPatch"
      responses:
        "200":
          $ref: "#/components/responses/EventSuccess"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /cms/events/{id}/publish:
    patch:
      tags:
        - CMS Events
      summary: Publish event
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          $ref: "#/components/responses/EventSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cms/events/{id}/archive:
    patch:
      tags:
        - CMS Events
      summary: Archive event
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          $ref: "#/components/responses/EventSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cms/event-categories:
    $ref: "#/components/pathItems/CategoryCollection"
  /cms/event-categories/{id}:
    $ref: "#/components/pathItems/CategoryMember"
  /cms/product-categories:
    $ref: "#/components/pathItems/CategoryCollection"
  /cms/product-categories/{id}:
    $ref: "#/components/pathItems/CategoryMember"
  /cms/destination-categories:
    $ref: "#/components/pathItems/CategoryCollection"
  /cms/destination-categories/{id}:
    $ref: "#/components/pathItems/CategoryMember"
  /cms/museum/categories:
    $ref: "#/components/pathItems/CategoryCollection"
  /cms/museum/categories/{id}:
    $ref: "#/components/pathItems/CategoryMember"
  /cms/products:
    get:
      $ref: "#/components/pathItems/GenericContentList"
    post:
      $ref: "#/components/pathItems/GenericContentCreate"
  /cms/products/{id}:
    get:
      $ref: "#/components/pathItems/GenericContentDetail"
    patch:
      $ref: "#/components/pathItems/GenericContentUpdate"
  /cms/products/{id}/publish:
    patch:
      $ref: "#/components/pathItems/GenericContentState"
  /cms/products/{id}/archive:
    patch:
      $ref: "#/components/pathItems/GenericContentState"
  /cms/destinations:
    get:
      $ref: "#/components/pathItems/GenericContentList"
    post:
      $ref: "#/components/pathItems/GenericContentCreate"
  /cms/destinations/{id}:
    get:
      $ref: "#/components/pathItems/GenericContentDetail"
    patch:
      $ref: "#/components/pathItems/GenericContentUpdate"
  /cms/destinations/{id}/publish:
    patch:
      $ref: "#/components/pathItems/GenericContentState"
  /cms/destinations/{id}/archive:
    patch:
      $ref: "#/components/pathItems/GenericContentState"
  /cms/businesses:
    get:
      $ref: "#/components/pathItems/GenericContentList"
    post:
      $ref: "#/components/pathItems/GenericContentCreate"
  /cms/businesses/{id}:
    get:
      $ref: "#/components/pathItems/GenericContentDetail"
    patch:
      $ref: "#/components/pathItems/GenericContentUpdate"
  /cms/museum/artifacts:
    get:
      $ref: "#/components/pathItems/GenericContentList"
    post:
      $ref: "#/components/pathItems/GenericContentCreate"
  /cms/museum/artifacts/{id}:
    get:
      $ref: "#/components/pathItems/GenericContentDetail"
    patch:
      $ref: "#/components/pathItems/GenericContentUpdate"
  /cms/museum/artifacts/{id}/publish:
    patch:
      $ref: "#/components/pathItems/GenericContentState"
  /cms/museum/artifacts/{id}/archive:
    patch:
      $ref: "#/components/pathItems/GenericContentState"
  /cms/map-locations:
    get:
      $ref: "#/components/pathItems/GenericContentList"
    post:
      $ref: "#/components/pathItems/GenericContentCreate"
  /cms/map-locations/{id}:
    get:
      $ref: "#/components/pathItems/GenericContentDetail"
    patch:
      $ref: "#/components/pathItems/GenericContentUpdate"
    delete:
      $ref: "#/components/pathItems/GenericContentDelete"
  /cms/media:
    get:
      $ref: "#/components/pathItems/OperationsList"
    post:
      $ref: "#/components/pathItems/OperationsCreate"
  /cms/media/{id}:
    get:
      $ref: "#/components/pathItems/OperationsDetail"
    patch:
      $ref: "#/components/pathItems/OperationsUpdate"
  /cms/media/{id}/archive:
    patch:
      $ref: "#/components/pathItems/OperationsState"
  /cms/inquiries:
    get:
      $ref: "#/components/pathItems/OperationsList"
  /cms/inquiries/{id}:
    get:
      $ref: "#/components/pathItems/OperationsDetail"
  /cms/inquiries/{id}/status:
    patch:
      $ref: "#/components/pathItems/OperationsUpdate"
  /cms/inquiries/{id}/responses:
    get:
      $ref: "#/components/pathItems/OperationsDetail"
    post:
      $ref: "#/components/pathItems/OperationsCreate"
  /cms/newsletter-subscribers:
    get:
      $ref: "#/components/pathItems/OperationsList"
  /cms/newsletter-subscribers/{id}/status:
    patch:
      $ref: "#/components/pathItems/OperationsUpdate"
  /cms/users:
    get:
      $ref: "#/components/pathItems/OperationsList"
  /cms/users/{id}:
    get:
      $ref: "#/components/pathItems/OperationsDetail"
  /cms/users/{id}/status:
    patch:
      $ref: "#/components/pathItems/OperationsUpdate"
  /cms/users/{id}/roles:
    patch:
      $ref: "#/components/pathItems/OperationsUpdate"
  /cms/roles:
    get:
      $ref: "#/components/pathItems/OperationsArray"
  /cms/permissions:
    get:
      $ref: "#/components/pathItems/OperationsArray"
  /cms/audit-logs/{id}:
    get:
      $ref: "#/components/pathItems/OperationsDetail"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchParam:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    StatusParam:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/ContentStatus"
    FeaturedParam:
      name: featured
      in: query
      schema:
        type: boolean
    UuidPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  pathItems:
    CategoryCollection:
      get:
        tags:
          - CMS Categories
        summary: Paginated CMS categories
        security:
          - BearerAuth: []
        parameters:
          - $ref: "#/components/parameters/PageParam"
          - $ref: "#/components/parameters/LimitParam"
          - $ref: "#/components/parameters/SearchParam"
          - $ref: "#/components/parameters/StatusParam"
          - name: sort
            in: query
            schema:
              type: string
              enum: [displayOrder, -displayOrder, createdAt, -createdAt, updatedAt, -updatedAt, name, -name, status]
        responses:
          "200":
            description: Paginated categories
            content:
              application/json:
                schema:
                  allOf:
                    - $ref: "#/components/schemas/PaginatedEnvelope"
                    - type: object
                      properties:
                        data:
                          type: array
                          items:
                            $ref: "#/components/schemas/CmsCategory"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
      post:
        tags:
          - CMS Categories
        summary: Create CMS category
        security:
          - BearerAuth: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsCategoryInput"
        responses:
          "201":
            $ref: "#/components/responses/CategorySuccess"
          "400":
            $ref: "#/components/responses/ValidationError"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "409":
            $ref: "#/components/responses/Conflict"
    CategoryMember:
      patch:
        tags:
          - CMS Categories
        summary: Update CMS category
        security:
          - BearerAuth: []
        parameters:
          - $ref: "#/components/parameters/UuidPathParam"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsCategoryPatch"
        responses:
          "200":
            $ref: "#/components/responses/CategorySuccess"
          "400":
            $ref: "#/components/responses/ValidationError"
          "401":
            $ref: "#/components/responses/Unauthorized"
          "403":
            $ref: "#/components/responses/Forbidden"
          "404":
            $ref: "#/components/responses/NotFound"
          "409":
            $ref: "#/components/responses/Conflict"
    GenericContentList:
      tags:
        - CMS Products
        - CMS Destinations
        - CMS Businesses
        - CMS Museum
        - CMS Map Locations
      summary: Paginated CMS content list
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/StatusParam"
        - $ref: "#/components/parameters/FeaturedParam"
      responses:
        "200":
          description: Paginated CMS records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    GenericContentCreate:
      tags:
        - CMS Products
        - CMS Destinations
        - CMS Businesses
        - CMS Museum
        - CMS Map Locations
      summary: Create CMS content record
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created CMS record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    GenericContentDetail:
      tags:
        - CMS Products
        - CMS Destinations
        - CMS Businesses
        - CMS Museum
        - CMS Map Locations
      summary: Get CMS content record by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          description: CMS record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    GenericContentUpdate:
      tags:
        - CMS Products
        - CMS Destinations
        - CMS Businesses
        - CMS Museum
        - CMS Map Locations
      summary: Update CMS content record
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated CMS record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    GenericContentState:
      tags:
        - CMS Products
        - CMS Destinations
        - CMS Museum
      summary: Publish or archive CMS content record
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          description: Updated CMS record state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    GenericContentDelete:
      tags:
        - CMS Map Locations
      summary: Delete CMS map location
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UuidPathParam"
      responses:
        "200":
          description: Deleted CMS record response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    OperationsList:
      tags:
        - CMS Operations
      summary: Paginated protected CMS operations list
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
        - $ref: "#/components/parameters/StatusParam"
      responses:
        "200":
